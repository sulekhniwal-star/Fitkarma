name: FitKarma Enterprise CD & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Release Bundles & Deploy Rules
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Pre-Release Tests
        run: flutter test

      - name: Build Android Release AppBundle (.aab)
        run: flutter build appbundle --release

      - name: Build iOS Release (.ipa)
        run: flutter build ipa --release --no-codesign

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            build/app/outputs/bundle/release/*.aab
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa

      - name: Deploy Firebase Rules & Cloud Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "Simulating / executing: firebase deploy --only firestore:rules,storage:rules,functions"
