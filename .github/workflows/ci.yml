name: FitKarma CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit, Widget & Clinical Compliance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze

      - name: Verify Clinical Copy Compliance (§P10-M)
        run: dart run scripts/verify_clinical_copy.dart

      - name: Verify Environment Dart-Define Variables (§P14-D)
        run: dart run scripts/verify_dart_defines.dart --env=prod

      - name: Run Test Suite
        run: flutter test

  build-android:
    name: Build Android AppBundle (Release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android AppBundle
        run: |
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=AZURE_SQL_ENDPOINT=${{ secrets.AZURE_SQL_ENDPOINT || 'https://fitkarma-api.azurewebsites.net' }} \
            --dart-define=AZURE_FUNCTION_BASE_URL=${{ secrets.AZURE_FUNCTION_BASE_URL || 'https://fitkarma-func.azurewebsites.net/api' }} \
            --dart-define=AZURE_ENTRA_CLIENT_ID=${{ secrets.AZURE_ENTRA_CLIENT_ID || 'fitkarma-entra-b2c-client-id' }} \
            --dart-define=GROQ_FUNCTION_KEY=${{ secrets.GROQ_FUNCTION_KEY || 'groq_sec_key_2026' }}

  build-ios:
    name: Build iOS IPA (Release)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --no-codesign \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=AZURE_SQL_ENDPOINT=${{ secrets.AZURE_SQL_ENDPOINT || 'https://fitkarma-api.azurewebsites.net' }} \
            --dart-define=AZURE_FUNCTION_BASE_URL=${{ secrets.AZURE_FUNCTION_BASE_URL || 'https://fitkarma-func.azurewebsites.net/api' }} \
            --dart-define=AZURE_ENTRA_CLIENT_ID=${{ secrets.AZURE_ENTRA_CLIENT_ID || 'fitkarma-entra-b2c-client-id' }} \
            --dart-define=GROQ_FUNCTION_KEY=${{ secrets.GROQ_FUNCTION_KEY || 'groq_sec_key_2026' }}
