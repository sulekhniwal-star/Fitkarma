name: FitKarma Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze-and-test:
    name: Flutter Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis & Lint Rules
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

      - name: Security & Secrets Scan
        run: |
          echo "Scanning for forbidden plaintext API key patterns..."
          ! grep -rE "gsk_[a-zA-Z0-9]{32,}|sk-proj-[a-zA-Z0-9]{32,}|rc_secret_" lib/ || (echo "FAILED: Secret key detected in lib/" && exit 1)
          echo "Security scan passed: Zero client secrets found."

  android-build-check:
    name: Android Build Verification (Ubuntu)
    runs-on: ubuntu-latest
    needs: [ analyze-and-test ]
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Android Gradle & Compilation
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          flutter build apk --debug --flavor dev -t lib/main_dev.dart \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
