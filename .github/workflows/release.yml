name: FitKarma Production Release (Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  pre_release_verification:
    name: Verify Branch Parity, Run Tests & Debug Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Branch Parity with develop
        run: |
          echo "🔍 Fetching develop branch from origin..."
          git fetch origin develop:refs/remotes/origin/develop

          echo "🔍 Comparing file tree between main (HEAD) and origin/develop..."
          DIFF_STATUS=$(git diff --name-status origin/develop HEAD)
          
          if [ -n "$DIFF_STATUS" ]; then
            echo "❌ ERROR: Branch parity mismatch detected!"
            echo "The 'main' branch must have identical files to the verified 'develop' branch before releasing."
            echo "--------------------------------------------------------"
            echo "$DIFF_STATUS"
            echo "--------------------------------------------------------"
            echo "Action Required: Synchronize or merge 'develop' into 'main' and re-push."
            exit 1
          else
            echo "✅ Branch parity check passed: 'main' is identical to 'develop'."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Upgrade Flutter & Dependencies
        run: |
          flutter upgrade --force
          flutter pub upgrade --major-versions
          flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite
        run: flutter test --coverage

  build_android:
    name: Build Android Release (APK & AAB)
    needs: pre_release_verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Upgrade Flutter & Dependencies
        run: |
          flutter upgrade --force
          flutter pub upgrade --major-versions
          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB for Play Store)
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build_ios_ipa:
    name: Build iOS IPA Package
    needs: pre_release_verification
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Upgrade Flutter & Dependencies
        run: |
          flutter upgrade --force
          flutter pub upgrade --major-versions
          flutter pub get

      - name: Build iOS Release Package
        run: flutter build ios --release --no-codesign
