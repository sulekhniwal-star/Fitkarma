name: FitKarma Production Release CD (Main Branch)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release-android:
    name: Build & Release Android (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> $GITHUB_ENV
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 not set; falling back to default/debug signing."
          fi

      - name: Build Android Release AppBundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          flutter build appbundle --flavor prod -t lib/main_prod.dart --release \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL"

      - name: Build Android Release Split APKs (.apk)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          flutter build apk --flavor prod -t lib/main_prod.dart --release --split-per-abi \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL"

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-android-prod-release
          path: |
            build/app/outputs/bundle/prodRelease/*.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30

      - name: Deploy to Google Play (Internal Track)
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.sulekhniwal.fitkarma
          releaseFiles: build/app/outputs/bundle/prodRelease/*.aab
          track: internal
          status: completed

  release-ios:
    name: Build & Release iOS (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS Release Archive (.ipa)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          flutter build ipa --flavor prod -t lib/main_prod.dart --release --no-codesign \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL"

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-ios-prod-release
          path: |
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa
          retention-days: 30

  deploy-supabase:
    name: Deploy Supabase Schema Migrations
    runs-on: ubuntu-latest
    needs: [ release-android, release-ios ]
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Deploy Supabase Migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase db push
