name: FitKarma Production Release CD (Main Branch)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release-android:
    name: Build & Release Android (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> $GITHUB_ENV
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 not set; falling back to default/debug signing."
          fi

      - name: Build Android Release AppBundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart --release

      - name: Build Android Release Split APKs (.apk)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --flavor prod -t lib/main_prod.dart --release --split-per-abi

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-android-prod-release
          path: |
            build/app/outputs/bundle/prodRelease/*.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30

      - name: Deploy to Google Play (Internal Track)
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v4
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.sulekhniwal.fitkarma
          releaseFiles: build/app/outputs/bundle/prodRelease/*.aab
          track: internal
          status: completed

  release-ios:
    name: Build & Release iOS (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS Release Archive (.ipa)
        run: flutter build ipa --flavor prod -t lib/main_prod.dart --release --no-codesign

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitkarma-ios-prod-release
          path: |
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa
          retention-days: 30

  deploy-cloud-and-rules:
    name: Deploy Firebase Rules & Cloud Functions
    runs-on: ubuntu-latest
    needs: [ release-android, release-ios ]
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'functions/package.json'

      - name: Install Cloud Functions Dependencies
        working-directory: ./functions
        run: npm ci || npm install

      - name: Deploy Firebase Rules & Functions
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only firestore:rules,storage:rules,functions --token "$FIREBASE_TOKEN"
