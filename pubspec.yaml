name: fitkarma
description: "India's intelligent health operating system — AI-adaptive fitness, nutrition, and wellness."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3

  # Firebase Core & Services
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0

  # Local Offline Storage (Transient & High-Frequency)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Fonts & Animations
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0

  # Monetization (RevenueCat)
  purchases_flutter: ^10.10.0

  # Security & Biometrics
  local_auth: ^3.0.2

  # Utility & Formatting
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0-dev.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
