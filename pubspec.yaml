name: fitkarma
description: "India's Intelligent Health Operating System — offline-first, AI-adaptive fitness, nutrition, and wellness platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.4.0

  # Local DB & Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^11.0.0

  # Networking & HTTP
  http: ^1.2.1
  dio: ^5.4.3+1

  # Design & UI
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Monitoring
  sentry_flutter: ^9.0.0
  image: ^4.9.1

  # Utilities
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/food_db/
