name: fitkarma
description: "India's intelligent health operating system — AI-adaptive fitness, nutrition, and wellness."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Riverpod 2.x as per FitKarma_Documentation.md)
  flutter_riverpod: ^2.6.1

  # Supabase Backend & Auth & Storage & Realtime
  supabase_flutter: ^2.8.0

  # Local Encrypted & Offline-First Persistence (Drift + SQLite + Hive)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Push Notifications
  firebase_messaging: ^16.6.0

  # UI, Fonts & Animations
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0

  # Monetization (RevenueCat)
  purchases_flutter: ^10.10.0

  # Security & Biometrics
  local_auth: ^3.0.2

  # Utility & Formatting
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
