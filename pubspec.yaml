name: fitkarma
description: "FitKarma — Personalized AI-Driven Health & Fitness OS for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Database & Encryption
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Backend & Auth
  supabase_flutter: ^2.3.4
  
  # UI & Design System
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
